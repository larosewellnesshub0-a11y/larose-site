<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="La Rose">
  <!-- The brand mark, traced from the clinic's own logo artwork, on the brand olive.
       A circle rather than a square: browsers and Google both mask a favicon into a
       circle, and a square left its own corners showing inside that mask. The icon
       before this was a generic map pin and did not represent the brand at all. The
       "LA" monogram is the only part of the wordmark still legible at 16px.
       Two traps, both hit while making this: potracer traces the FALSE cells, so the
       ink mask has to be inverted or you get the page with letter-shaped holes; and
       the nested contours need fill-rule="evenodd" or the counters fill in solid. -->
