name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the site
        run: node build/build.mjs
      - name: Validate
        run: node tools/validate.mjs
      - name: Add the dashboard to the published tree
        run: |
          rm -rf site/dashboard
          cp -R dashboard site/dashboard
          node tools/snapshot-content.mjs
          rm -f site/_viewport.html site/_bookpages.html
          test -f site/CNAME
          test -f site/.nojekyll
          # snapshot-content.mjs writes ONE file, index.json, so testing for
          # per-name files here could never fail. Assert on what it actually
          # produces: the snapshot exists and carries no private collection.
          test -s site/dashboard/content/index.json
          node -e '
            const s = require("./site/dashboard/content/index.json");
            const leaked = ["pricing.json", "campaigns.json"].filter((n) => n in s.files);
            const underscored = Object.keys(s.files).filter((n) => n.startsWith("_"));
            if (leaked.length || underscored.length) {
              console.error("Private content in the published snapshot:", [...leaked, ...underscored].join(", "));
              process.exit(1);
            }
            console.log("Snapshot carries " + Object.keys(s.files).length + " public files, no private ones.");
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
